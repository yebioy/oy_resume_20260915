<!DOCTYPE html>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b03a2e'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='white'%3E%E9%99%88%3C/text%3E%3C/svg%3E">
<style>
    /* 基础 */
    body {
        margin: 0;
        background: #f6f3ec;
        color: #2a251f;
        font-family: "Microsoft YaHei", sans-serif;
        line-height: 2;
    }

    main {
        max-width: 560px;
        margin: 0 auto;
        padding: 60px 24px;
        text-align: center;
    }

    /* 头部 */
    h1 {
        margin: 0;
        font-family: "SimSun", serif;
        font-size: 52px;
        letter-spacing: 8px;
    }

    .sub {
        color: #8a8274;
        font-size: 14px;
        letter-spacing: 4px;
        margin-bottom: 8px;
    }

    .line {
        width: 44px;
        height: 3px;
        background: #b03a2e;
        margin: 18px auto 26px;
    }

    /* 信息列表 */
    .list {
        text-align: left;
        max-width: 380px;
        margin: 0 auto;
    }

    .row {
        display: flex;
        gap: 18px;
        padding: 9px 0;
    }

    .row span {
        flex: 0 0 80px;
        color: #8a8274;
    }

    .row a {
        display: inline-block;
        padding: 6px 0;
    }

    a {
        color: #2a251f;
        text-decoration: none;
    }

    /* 按钮 */
    .btn {
        display: inline-block;
        margin-top: 30px;
        padding: 10px 42px;
        background: #b03a2e;
        color: #fff;
        border-radius: 999px;
    }

    .btn:hover {
        background: #8f2d24;
    }

    /* 手机适配 */
    @media (max-width: 480px) {
        main {
            padding: 40px 20px;
        }

        h1 {
            font-size: 42px;
            letter-spacing: 5px;
        }
    }
</style>
</head>
<body>
<main>
<p class="sub">个人简历</p>
<h1>陈思怡</h1>

<div class="list">

<div class="row"><span>邮箱</span><a href="mailto:renran_86@qq.com">renran_86@qq.com</a></div>
