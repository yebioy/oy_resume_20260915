<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陈思怡 · 个人简历</title>
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23b03a2e"/><text x="50" y="72" font-size="60" text-anchor="middle" fill="%23ffffff" font-family="serif">%E9%99%88</text></svg>'>
    <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
    <style>
        :root {
            --paper: #f6f3ec;
            --ink: #2a251f;
            --muted: #8a8274;
            --line: #e3ddd2;
            --red: #b03a2e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
            background: var(--paper);
            color: var(--ink);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .sheet {
            width: min(92%, 620px);
            margin: 0 auto;
            padding: 7vh 8px;
        }

        /* ===== 头部：名字 + 印章 ===== */
        .overline {
            font-size: 0.88rem;
            letter-spacing: 0.35em;
            color: var(--muted);
            margin-bottom: 14px;
        }

        .name-row {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        h1 {
            font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
            font-weight: 900;
            font-size: clamp(2.6rem, 9vw, 3.6rem);
            letter-spacing: 0.08em;
            line-height: 1.15;
        }

        .seal {
            flex: 0 0 auto;
            width: 52px;
            height: 52px;
            background: var(--red);
            color: #fff;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
            font-weight: 600;
            font-size: 1.05rem;
            line-height: 1.15;
            letter-spacing: 0.02em;
            transform: rotate(-3deg);
            box-shadow: 0 3px 10px rgba(176, 58, 46, 0.28);
            user-select: none;
        }

        .head-rule {
            height: 2px;
            background: var(--ink);
            margin: 22px 0 6px;
        }

        /* ===== 账页式信息行 ===== */
        .row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 24px;
            padding: 13px 0;
            border-bottom: 1px solid var(--line);
        }

        .row dt {
            color: var(--muted);
            font-size: 0.9rem;
            flex: 0 0 auto;
        }

        .row dd {
            font-size: 0.97rem;
            text-align: right;
            word-break: break-all;
        }

        .row a {
            color: var(--ink);
            text-decoration: none;
            border-bottom: 1px dashed #bfb6a4;
            transition: color 0.18s ease, border-color 0.18s ease;
        }

        .row a:hover {
            color: var(--red);
            border-bottom-color: var(--red);
        }

        .row .tag {
            display: inline-block;
            padding: 2px 14px;
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: 0.9rem;
            color: var(--ink);
        }

        /* ===== 发送邮件 ===== */
        .actions {
            margin-top: 30px;
            text-align: center;
        }

        .mail-btn {
            display: inline-block;
            padding: 11px 40px;
            border: 1px solid var(--ink);
            border-radius: 999px;
            color: var(--ink);
            font-size: 0.95rem;
            letter-spacing: 0.12em;
            text-indent: 0.12em;
            text-decoration: none;
            transition: background 0.18s ease, color 0.18s ease;
        }

        .mail-btn:hover {
            background: var(--ink);
            color: var(--paper);
        }

        /* ===== 页脚 ===== */
        .footer {
            margin-top: 34px;
            text-align: center;
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            color: var(--muted);
        }

        @media (max-width: 480px) {
            .sheet {
                padding: 8vh 4px;
            }

            .name-row {
                gap: 14px;
            }

            .seal {
                width: 46px;
                height: 46px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <main class="sheet">

        <p class="overline">个人简历 · Resume</p>

        <div class="name-row">
            <h1><a href="https://www.kdocs.cn/l/cms0v0uyOUzY" style="color:inherit;text-decoration:none;" title="查看个人文档">陈思怡</a></h1>
            <span class="seal" aria-hidden="true">思怡</span>
        </div>

        <div class="head-rule"></div>

        <dl>
            <div class="row">
                <dt>籍贯</dt>
                <dd>广东普宁</dd>
            </div>
            <div class="row">
                <dt>居住地</dt>
                <dd>广东珠海</dd>
            </div>
            <div class="row">
                <dt>邮箱</dt>
                <dd><a href="mailto:renran_86@qq.com">renran_86@qq.com</a></dd>
            </div>
            <div class="row">
                <dt>电话</dt>
                <dd><a href="tel:18825677194">18825677194</a></dd>
            </div>
            <div class="row">
                <dt>兴趣爱好</dt>
                <dd>看漫剧 · 打羽毛球</dd>
            </div>
            <div class="row">
                <dt>个人经历</dt>
                <dd>2025 – 2028 · 广东科学技术职业学院</dd>
            </div>
            <div class="row">
                <dt>竞赛</dt>
                <dd><span class="tag">软件杯</span></dd>
            </div>
        </dl>

        <div class="actions">
            <a class="mail-btn" href="mailto:renran_86@qq.com">发送邮件</a>
        </div>

        <p class="footer">陈思怡 · 个人简历</p>

    </main>

</body>
</html>
